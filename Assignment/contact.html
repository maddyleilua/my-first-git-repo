<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact page</title>
    <link rel="stylesheet" href="contact.css" />
  </head>
  <body>
    <header class="header">
      <h1>Contact Me!</h1>
      <p>Let me know what your interests are 😊</p>
    </header>

<div class="left">

    <form
      class="form"
      action="mailto:someone@email.com"
      method="post"
      autocomplete="on"
    >
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />
      <!-- Email field -->
      <br />
      <label for="email">Email:</label>
      <input class="type="email" id="email" required />
      <br />

      <!-- Radio field -->
      <br />
      <label>What do you wanna talk about?</label>
      <br />
      <input type="radio" id="Anime" name="subject" value="Anime" />
      <label for="Anime">Anime</label>

      <br />
      <input type="radio" id="Games" name="subject" value="Games" />
      <label for="Games">Games</label>

      <br />
      <input type="radio" id="Characters" name="subject" value="Characters" />
      <label for="Characters">Characters</label>
      <br />

      <!-- Message field -->
      <br />
      <label for="message" class="message">Message:</label>
      <br />
      <textarea
        class="textarea"
        name="message"
        id="message"
        rows="5"
        cols="25"
      ></textarea>

      <!-- Submit button field -->
      <br />
      <input type="submit" value="Submit" />
    </form>

    </div>
  </body>
</html>
